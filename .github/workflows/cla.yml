name: CLA

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  singlecla:
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    runs-on: ubuntu-latest

    steps:
      - name: Check Single CLA
        uses: actions/github-script@v8
        with:
          script: |
            const marker = "<!-- singlecla -->";
            const neededLabel = "cla needed";
            const acceptLine = "I agree that the Single CLA applies to this pull request.";
            const signedForkLine = "I have signed the Single CLA for future pull requests.";
            const optOutLine = "I do not agree that the Single CLA applies to this pull request.";
            const botLogins = new Set(["dependabot[bot]", "github-actions[bot]"]);

            const { owner, repo } = context.repo;

            async function loadPullRequest() {
              if (context.eventName === "pull_request_target") {
                return context.payload.pull_request;
              }

              const pull_number = context.payload.issue.number;
              const { data } = await github.rest.pulls.get({ owner, repo, pull_number });
              return data;
            }

            async function listComments(issue_number) {
              return await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
            }

            function hasAcceptedBodyLine(body, line) {
              const escaped = line.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              return new RegExp(`^\\s*${escaped}\\s*$`, "im").test(body || "");
            }

            function hasCommentLine(body, line) {
              const escaped = line.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              return new RegExp(`^\\s*${escaped}\\s*$`, "im").test(body || "");
            }

            async function verifySignedFork(login) {
              const userUrl = `https://raw.githubusercontent.com/${login}/singlecla/main/cla.md`;
              const userResponse = await fetch(userUrl);

              if (!userResponse.ok) return false;

              const userText = await userResponse.text();
              const version =
                userText.match(/^Version ([0-9]+\.[0-9]+\.[0-9]+)\b/m)?.[1] ||
                userText.match(/^# Single CLA Version ([0-9]+\.[0-9]+\.[0-9]+)\b/m)?.[1];
              const signed = /^Signed: \/[^{}]+\/$/m.test(userText);

              if (!version || !signed) return false;

              const templateUrl = `https://raw.githubusercontent.com/singlecla/singlecla/v${version}/cla.md`;
              const templateResponse = await fetch(templateUrl);

              if (!templateResponse.ok) return false;

              const templateText = await templateResponse.text();
              const withoutSignature = (text) => text.replace(/^Signed: .*$\n?/m, "").trim();

              return withoutSignature(userText) === withoutSignature(templateText);
            }

            async function ensureLabel() {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: neededLabel });
              } catch (error) {
                if (error.status !== 404) throw error;

                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: neededLabel,
                  color: "b60205",
                  description: "Contributor license agreement still needs attention",
                });
              }
            }

            async function addNeededLabel(issue_number, labels) {
              if (labels.some((label) => label.name === neededLabel)) return;

              await ensureLabel();
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [neededLabel],
              });
            }

            async function removeNeededLabel(issue_number, labels) {
              if (!labels.some((label) => label.name === neededLabel)) return;

              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: neededLabel,
              });
            }

            async function upsertComment(issue_number, comments, body) {
              const existing = comments.find((comment) => comment.user.type === "Bot" && comment.body?.includes(marker));

              if (existing) {
                if (existing.body !== body) {
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: existing.id,
                    body,
                  });
                }
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }

            async function addPlusOneReaction(comment) {
              try {
                await github.rest.reactions.createForIssueComment({
                  owner,
                  repo,
                  comment_id: comment.id,
                  content: "+1",
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

            function neededComment(login) {
              return [
                marker,
                "Thanks for contributing.",
                "",
                "This repo requires the [Single CLA](https://github.com/singlecla/singlecla) for contributions.",
                "",
                "Please choose one of these ways to clear the CLA requirement:",
                "",
                "1. For just this PR, add a PR comment with exactly:",
                "",
                `   \`${acceptLine}\``,
                "",
                "2. For this and future PRs to projects that accept Single CLA, fork https://github.com/singlecla/singlecla to your GitHub account and commit your signature to `cla.md`, then add a PR comment with exactly:",
                "",
                `   \`${signedForkLine}\``,
              ].join("\n");
            }

            const pullRequest = await loadPullRequest();
            const issue_number = pullRequest.number;
            const login = pullRequest.user.login;
            const labels = pullRequest.labels || [];
            const comments = await listComments(issue_number);
            const authorComments = comments.filter((comment) => comment.user.login === login);
            const bodyWithoutComments = (pullRequest.body || "").replace(/<!--[\s\S]*?-->/g, "");

            if (botLogins.has(login) || pullRequest.user.type === "Bot") {
              await removeNeededLabel(issue_number, labels);
              core.info(`Skipping CLA for bot author ${login}.`);
              return;
            }

            const optedOut =
              hasAcceptedBodyLine(bodyWithoutComments, optOutLine) ||
              authorComments.some((comment) => hasCommentLine(comment.body, optOutLine));

            const acceptedComment = authorComments.find((comment) => hasCommentLine(comment.body, acceptLine));
            const signedForkComment = authorComments.find((comment) => hasCommentLine(comment.body, signedForkLine));
            const acceptedInPullRequest =
              hasAcceptedBodyLine(bodyWithoutComments, acceptLine) ||
              Boolean(acceptedComment);

            const signedFork = await verifySignedFork(login);
            const covered = !optedOut && (acceptedInPullRequest || signedFork);

            if (covered) {
              await removeNeededLabel(issue_number, labels);

              if (!optedOut && acceptedComment) {
                await addPlusOneReaction(acceptedComment);
              }

              if (!optedOut && signedFork && signedForkComment) {
                await addPlusOneReaction(signedForkComment);
              }

              core.info(`CLA covered for ${login}.`);
            } else {
              await addNeededLabel(issue_number, labels);
              await upsertComment(issue_number, comments, neededComment(login));
              core.info(`CLA still needed for ${login}.`);
            }
